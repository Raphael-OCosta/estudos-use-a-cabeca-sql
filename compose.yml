# Banco PostgreSQL só para os estudos do Use a Cabeça! SQL.
# Subir:  docker compose up -d      Parar:  docker compose stop
services:
  postgres:
    image: postgres:16-alpine
    container_name: use-a-cabeca-sql
    environment:
      POSTGRES_USER: estudos
      POSTGRES_PASSWORD: estudos
      POSTGRES_DB: use_a_cabeca
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dados_sql:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  dados_sql:
